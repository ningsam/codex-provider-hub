<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Codex Provider Hub</title>
  <desc id="desc">A local-first macOS control center for Codex gateways, OAuth account pools, providers and quotas.</desc>
  <defs>
    <linearGradient id="bg" x1="58" y1="0" x2="1190" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF6FF"/>
      <stop offset="0.48" stop-color="#E8F0FF"/>
      <stop offset="1" stop-color="#EEE9FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#36C9FF"/>
      <stop offset="0.52" stop-color="#4C79FF"/>
      <stop offset="1" stop-color="#7957F6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0.88"/>
      <stop offset="1" stop-color="white" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1017 268) rotate(90) scale(130)">
